name: Supabase keep-alive

on:
  schedule:
    - cron: '17 5 */3 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping-database:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase database
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [[ -z "$SUPABASE_URL" || -z "$SUPABASE_ANON_KEY" ]]; then
            echo "::error::Configura VITE_SUPABASE_URL nelle Variables e VITE_SUPABASE_ANON_KEY nei Secrets del repository."
            exit 1
          fi

          curl --fail-with-body --silent --show-error \
            --connect-timeout 10 \
            --max-time 30 \
            --retry 3 \
            --retry-all-errors \
            --request POST \
            --header "apikey: $SUPABASE_ANON_KEY" \
            --header "Authorization: Bearer $SUPABASE_ANON_KEY" \
            --header "Content-Type: application/json" \
            --data '{}' \
            "$SUPABASE_URL/rest/v1/rpc/get_public_ordering_status"
