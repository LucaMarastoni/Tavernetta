<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/images/favicon/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/images/favicon/favicon-32x32.png" sizes="32x32" />
    <link rel="icon" type="image/png" href="/images/favicon/favicon-16x16.png" sizes="16x16" />
    <link rel="apple-touch-icon" href="/images/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="/images/favicon/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <meta name="description" content="Pagina non trovata sul sito Tavernetta." />
    <title>Pagina non trovata | Tavernetta</title>
    <script>
      (function () {
        const basePath = '%BASE_URL%';
        const normalizedBasePath = basePath.endsWith('/') ? basePath : `${basePath}/`;
        const currentUrl = `${window.location.pathname}${window.location.search}${window.location.hash}`;
        const relativePath = currentUrl.startsWith(normalizedBasePath)
          ? currentUrl.slice(normalizedBasePath.length - 1)
          : currentUrl;
        const redirectTarget = relativePath.startsWith('/') ? relativePath : `/${relativePath}`;

        window.location.replace(
          `${window.location.origin}${normalizedBasePath}?redirect=${encodeURIComponent(redirectTarget)}`,
        );
      })();
    </script>
  </head>
  <body></body>
</html>
